name: Build and Release RedPanda-CPP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

env:
  # 提前启用 Node.js 24 运行时，以消除弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      # ==========================================
      # 1. Checkout 源码仓库
      # ==========================================
      - name: Checkout RedPanda-CPP source
        # 升级到 v5
        uses: actions/checkout@v5
        with:
          repository: 'xccfcpd/RedPanda-CPP'
          ref: copied-master-plus
          fetch-depth: 0
          path: source

      # ==========================================
      # 2. Checkout 工具链仓库（当前仓库）
      # ==========================================
      - name: Checkout RedPandaKit toolchain
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          path: kit

      # ==========================================
      # 3. 合并分卷还原成完整的 RedPandaKit.7z
      #    Windows 的 copy /b 可以二进制合并
      # ==========================================
      - name: Merge split archives
        shell: pwsh
        run: |
          Write-Host "合并分卷..."
          cmd /c copy /b "kit\toolchain\RedPandaKit-split.7z.001" + "kit\toolchain\RedPandaKit-split.7z.002" "RedPandaKit.7z"
          Write-Host "合并完成"

      # ==========================================
      # 4. SHA256 校验（跟原来完全一致）
      # ==========================================
      - name: Verify SHA256 checksum
        shell: pwsh
        run: |
          # 重要提示：RedPandaKit.7z的真实 SHA256 哈希值！
          $expectedHash = "f50f0da6bf7911e20773fc164ec9f29455b9cf5913d794876acb7c5d78250d88"

          # 计算合并后文件的哈希值
          $actualHash = (Get-FileHash -Path "RedPandaKit.7z" -Algorithm SHA256).Hash

          Write-Host "预期哈希值 (Expected): $expectedHash"
          Write-Host "实际哈希值 (Actual):   $actualHash"

          # 对比哈希值 (忽略大小写)，如果不一致则报错并强行终止后续步骤
          if ($actualHash -ne $expectedHash) {
            Write-Error "致命错误：RedPandaKit.7z 的 SHA256 校验失败！文件可能已损坏或被篡改。"
            exit 1
          } else {
            Write-Host "SHA256 校验通过！文件完整性确认。"
          }

      # ==========================================
      # 5. 解压工具链（只有校验通过才会执行到此步）
      # ==========================================
      - name: Extract toolchain
        shell: pwsh
        run: |
          & "C:\Program Files\7-Zip\7z.exe" x RedPandaKit.7z -o"${{ github.workspace }}" -y

      # ==========================================
      # 6. 配置环境变量
      # ==========================================
      - name: Setup environment
        shell: pwsh
        run: |
          $toolchainRoot = "${{ github.workspace }}\RedPandaKit"
          echo "$toolchainRoot\bin" >> $env:GITHUB_PATH
          echo "CMAKE_PREFIX_PATH=$toolchainRoot" >> $env:GITHUB_ENV
          echo "QT_PLUGIN_PATH=$toolchainRoot\plugins" >> $env:GITHUB_ENV

      # ==========================================
      # 6.5 诊断：确认实际使用的 CMake / Ninja 版本
      # ==========================================
      - name: Diagnose CMake and Ninja
        shell: pwsh
        run: |
          Write-Host "===== 当前 PATH 中的 cmake ====="
          where.exe cmake
          Write-Host ""
          Write-Host "===== 当前 PATH 中的 ninja ====="
          where.exe ninja
          Write-Host ""
          Write-Host "===== cmake --version ====="
          cmake --version
          Write-Host ""
          Write-Host "===== ninja --version ====="
          ninja --version
          Write-Host ""
          Write-Host "===== 工具链中自带的 cmake ====="
          & "${{ github.workspace }}\RedPandaKit\bin\cmake.exe" --version
          Write-Host ""
          Write-Host "===== 工具链中自带的 ninja ====="
          & "${{ github.workspace }}\RedPandaKit\bin\ninja.exe" --version

      # ==========================================
      # 7. 编译与安装（强制使用工具链里的 CMake / Ninja）
      # ==========================================
      - name: Configure, Build and Install
        shell: pwsh
        working-directory: source
        run: |
          # 明确指定工具链里的 cmake 和 ninja，避免使用 GitHub 预装版
          $cmake = "${{ github.workspace }}\RedPandaKit\bin\cmake.exe"
          $ninja = "${{ github.workspace }}\RedPandaKit\bin\ninja.exe"

          # 打印一下实际使用的路径和版本，便于排查
          Write-Host "Using CMake: $cmake"
          Write-Host "Using Ninja: $ninja"
          & $cmake --version
          & $ninja --version

          mkdir build -Force
          cd build

          # 配置：显式指定 CMAKE_MAKE_PROGRAM 为工具链里的 ninja
          & $cmake -G Ninja `
                -DCMAKE_MAKE_PROGRAM="$ninja" `
                -DCMAKE_BUILD_TYPE=Release `
                -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" `
                "-DCMAKE_C_FLAGS_RELEASE=-O2 -DNDEBUG" `
                "-DCMAKE_CXX_FLAGS_RELEASE=-O2 -DNDEBUG" `
                "-DCMAKE_EXE_LINKER_FLAGS=-static -Wl,--strip-all" `
                -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH" `
                ..

          # 编译：使用工具链里的 cmake 驱动 ninja
          & $cmake --build . -j $env:NUMBER_OF_PROCESSORS

          # 安装
          & $cmake --install .

      # ==========================================
      # 8. 获取版本号与打包
      # ==========================================
      - name: Determine tag name
        id: gettag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "tag=${{ github.event.inputs.tag_name }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Package artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ github.workspace }}\install\*" -DestinationPath "RedPanda-CPP-${{ steps.gettag.outputs.tag }}-win64.zip" -Force

      # ==========================================
      # 9. 发布 Release
      # ==========================================
      - name: Upload Release
        # 升级到 v3
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.gettag.outputs.tag }}
          files: RedPanda-CPP-${{ steps.gettag.outputs.tag }}-win64.zip
          token: ${{ secrets.GITHUB_TOKEN }}
