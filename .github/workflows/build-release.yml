name: Build and Release RedPanda-CPP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

env:
  # 提前启用 Node.js 24 运行时，以消除弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout RedPanda-CPP source
        uses: actions/checkout@v5 # 升级到 v5
        with:
          repository: 'xccfcpd/RedPanda-CPP'
          ref: copied-master-plus
          fetch-depth: 0
          path: source

      # ==========================================
      # 1. 下载工具链
      # ==========================================
      - name: Download toolchain
        shell: pwsh
        run: |
          $url = "https://github.com/xccfcpd/RedPandaKit/releases/download/toolchain-1.0/RedPandaKit.7z"
          Invoke-WebRequest -Uri $url -OutFile RedPandaKit.7z

      # ==========================================
      # 2. SHA256 校验 (核心安全步骤)
      # ==========================================
      - name: Verify SHA256 checksum
        shell: pwsh
        run: |
          # ⚠️ 重要提示：RedPandaKit.7z的真实 SHA256 哈希值！
          $expectedHash = "f50f0da6bf7911e20773fc164ec9f29455b9cf5913d794876acb7c5d78250d88"
          
          # 计算已下载文件的哈希值
          $actualHash = (Get-FileHash -Path "RedPandaKit.7z" -Algorithm SHA256).Hash
          
          Write-Host "预期哈希值 (Expected): $expectedHash"
          Write-Host "实际哈希值 (Actual):   $actualHash"
          
          # 对比哈希值 (忽略大小写)，如果不一致则报错并强行终止后续步骤
          if ($actualHash -ne $expectedHash) {
            Write-Error "❌ 致命错误：RedPandaKit.7z 的 SHA256 校验失败！文件可能已损坏或被篡改。"
            exit 1
          } else {
            Write-Host "✅ SHA256 校验通过！文件完整性确认。"
          }

      # ==========================================
      # 3. 解压工具链 (只有校验通过才会执行到此步)
      # ==========================================
      - name: Extract toolchain
        shell: pwsh
        run: |
          & "C:\Program Files\7-Zip\7z.exe" x RedPandaKit.7z -o"${{ github.workspace }}" -y

      # ==========================================
      # 4. 配置环境变量
      # ==========================================
      - name: Setup environment
        shell: pwsh
        run: |
          $toolchainRoot = "${{ github.workspace }}\RedPandaKit"
          echo "$toolchainRoot\bin" >> $env:GITHUB_PATH
          echo "CMAKE_PREFIX_PATH=$toolchainRoot" >> $env:GITHUB_ENV
          echo "QT_PLUGIN_PATH=$toolchainRoot\plugins" >> $env:GITHUB_ENV

      # ==========================================
      # 5. 编译与安装
      # ==========================================
      - name: Configure, Build and Install
        shell: pwsh
        working-directory: source
        run: |
          mkdir build -Force
          cd build
          cmake -G Ninja `
                -DCMAKE_BUILD_TYPE=Release `
                -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" `
                "-DCMAKE_C_FLAGS_RELEASE=-O2 -DNDEBUG" `
                "-DCMAKE_CXX_FLAGS_RELEASE=-O2 -DNDEBUG" `
                "-DCMAKE_EXE_LINKER_FLAGS=-static -Wl,--strip-all" `
                -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH" `
                ..
          cmake --build . -j $env:NUMBER_OF_PROCESSORS
          cmake --install .

      # ==========================================
      # 6. 获取版本号与打包
      # ==========================================
      - name: Determine tag name
        id: gettag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "tag=${{ github.event.inputs.tag_name }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Package artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ github.workspace }}\install\*" -DestinationPath "RedPanda-CPP-${{ steps.gettag.outputs.tag }}-win64.zip" -Force

      # ==========================================
      # 7. 发布 Release
      # ==========================================
      - name: Upload Release
        uses: softprops/action-gh-release@v3 # 升级到 v3
        with:
          tag_name: ${{ steps.gettag.outputs.tag }}
          files: RedPanda-CPP-${{ steps.gettag.outputs.tag }}-win64.zip
          token: ${{ secrets.GITHUB_TOKEN }}
